name: Deploy to VPS

on:
  push:
    branches:
      - main # Chạy workflow mỗi khi push code lên branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          password: ${{ secrets.VM_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VM_TARGET_DIR || '/root/bot_dis' }}
            git pull origin main
            if [ -d "venv" ]; then
              source venv/bin/activate
              pip install -r requirements.txt
            else
              pip install -r requirements.txt
            fi
            npm install
            restart_time=$(date '+%Y-%m-%d %H:%M:%S')
            pm2 restart bot_dis || pm2 start "./venv/bin/python main.py" --name "bot_dis"
            for attempt in $(seq 1 25); do
              if pm2 logs bot_dis --err --lines 200 --nostream --raw 2>&1 | awk -v since="$restart_time" '
                substr($0, 1, 19) >= since && /app\.discord_bot\.cogs\.handlers - INFO - .* is ready$/ { ready = 1 }
                END { exit !ready }
              '; then
                echo "Casino Bot connected to Discord."
                pm2 save
                exit 0
              fi
              sleep 3
            done
            echo "Casino Bot did not report Discord readiness after restart." >&2
            exit 1

